name: Automatización de Versionamiento y Tags

on:
  workflow_dispatch:
    inputs:
      increment_type:
        description: 'Tipo de incremento para la versión'
        required: true
        default: 'patch'
        type: choice
        options:
          - patch
          - minor
          - major

jobs:
  bump-version:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Requerido para empujar commits y tags

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Trae todo el historial para leer los tags

      - name: Configurar Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@://github.com"

      - name: Obtener última versión (Tag)
        id: get_current_version
        run: |
          # Obtiene el último tag v*.*.*, si no existe inicia en v0.0.0
          CURRENT_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.0.0")
          CURRENT_VERSION=${CURRENT_TAG#v}
          echo "current_version=$CURRENT_VERSION" >> $GITHUB_ENV
          echo "La versión actual detectada es: $CURRENT_VERSION"

      - name: Calcular y Actualizar Versiones en JSONs (Nativo)
        id: update_project_files
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const currentVersion = process.env.current_version;
            const increment = "${{ github.event.inputs.increment_type }}";
            
            // 1. Parsear y calcular la nueva versión (MAJOR.MINOR.PATCH)
            let [major, minor, patch] = currentVersion.split('.').map(Number);
            
            if (increment === 'major') {
              major += 1;
              minor = 0;
              patch = 0;
            } else if (increment === 'minor') {
              minor += 1;
              patch = 0;
            } else if (increment === 'patch') {
              patch += 1;
            }
            
            const newVersion = `${major}.${minor}.${patch}`;
            const newTag = `v${newVersion}`;
            
            // Exportar variables de entorno para los siguientes pasos
            core.exportVariable('new_version', newVersion);
            core.exportVariable('new_tag', newTag);
            console.log(`Nueva versión calculada: ${newVersion} (${newTag})`);
            
            // 2. Actualizar package.json
            if (fs.existsSync('package.json')) {
              const packageJson = JSON.parse(fs.readFileSync('package.json', 'utf8'));
              packageJson.version = newVersion;
              fs.writeFileSync('package.json', JSON.stringify(packageJson, null, 2) + '\n');
              console.log('✓ package.json actualizado exitosamente.');
            }
            
            // 3. Actualizar app.json (Expo)
            if (fs.existsSync('app.json')) {
              const appJson = JSON.parse(fs.readFileSync('app.json', 'utf8'));
              if (appJson.expo) {
                appJson.expo.version = newVersion;
                fs.writeFileSync('app.json', JSON.stringify(appJson, null, 2) + '\n');
                console.log('✓ app.json actualizado exitosamente.');
              } else {
                console.log('⚠️ app.json encontrado pero no contiene la propiedad "expo".');
              }
            }

      - name: Verificar si el Tag ya existe
        run: |
          if git rev-parse "${{ env.new_tag }}" >/dev/null 2>&1; then
            echo "Error: El tag ${{ env.new_tag }} ya existe en el repositorio."
            exit 1
          fi

      - name: Confirmar Cambios en los Archivos del Proyecto
        run: |
          # Si se modificó package.json o app.json, hace commit y push de las modificaciones
          if [ -n "$(git status --porcelain)" ]; then
            git add package.json app.json
            git commit -m "chore(release): bump version to ${{ env.new_version }} [skip ci]"
            git push origin ${{ github.ref_name }}
          else
            echo "No se detectaron cambios en los archivos de configuración."
          fi

      - name: Crear y Publicar Git Tag
        run: |
          # El tag se adjunta automáticamente al nuevo commit que tiene las versiones actualizadas
          git tag -a ${{ env.new_tag }} -m "Release version ${{ env.new_version }}"
          git push origin ${{ env.new_tag }}

      - name: Preparar Outputs para Releases
        id: outputs
        run: |
          echo "tag_name=${{ env.new_tag }}" >> $GITHUB_OUTPUT
          echo "version=${{ env.new_version }}" >> $GITHUB_OUTPUT
